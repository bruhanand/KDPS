#:schema https://conductor.build/schemas/settings.repo.schema.json

# Shared Conductor config for the KDPS monorepo (app/backend = Django via uv,
# app/frontend = React/TS PWA via Vite). See README.md + DEPLOY.md.
#
# EVERY WORKSPACE IS ITS OWN RUNNING SYSTEM. Conductor gives each workspace a
# stable name and a block of ten host ports; `scripts/workspace-env.sh` turns
# those into a per-workspace Docker Compose project, so each workspace gets its
# own Postgres container, its own volume, its own database and its own three
# ports (PWA, API, Postgres). Workspaces can run and be tested in parallel, and
# `archive` below destroys the container and the volume when the workspace goes:
# the database lives exactly as long as the workspace does.
#
# There is deliberately NO [environment_variables] DATABASE_URL here, and there
# must never be one again. TOML values are static strings, so a URL written here
# would pin every workspace to one database — precisely the arrangement this
# setup removes. The per-workspace URL is written into `app/backend/.env` by
# `scripts/dev.sh`, and `config/settings.py` reads it via `load_dotenv()`.
# `load_dotenv` does not override a variable already present in the environment,
# so a value set here would silently beat the correct one in the file.

[scripts]
# SETUP BUILDS THE ENVIRONMENT; RUN STARTS THE APP. Setup is the slow half and
# happens once, when the workspace is created: fast-forward the root checkout so
# new workspaces start current, then provision THIS workspace — its own Postgres
# container on its own port, its dependencies, its schema and its seed data.
# `--setup-only` starts no servers, and Run does no provisioning it can avoid.
#
# The two still overlap in practice, because setup takes minutes on a fresh
# workspace and the Run button is right there. That used to fail outright: two
# `docker compose up` calls on one project is a hard conflict, not a no-op. Both
# now take a provisioning lock (dev.sh section 4), so an early Run waits for
# setup instead of colliding with it.
setup = """
git -C "$CONDUCTOR_ROOT_PATH" fetch --prune origin && git -C "$CONDUCTOR_ROOT_PATH" pull --ff-only || true
./scripts/dev.sh --setup-only
"""

# Archiving a workspace destroys its development environment: first the servers
# still running in it, then the Postgres container AND its data volume (`down
# -v`), then the regenerable, gitignored build artifacts each worktree carries.
# `npm run setup` recreates the latter; nothing recreates the database, which is
# the point.
#
# The servers come first and are not optional. Without that step they outlive the
# workspace — a Django API answering on a Conductor-allocated port, against the
# database this hook is about to delete, from a worktree that is about to be
# deleted. Nothing reaps them; Conductor reuses port blocks; the next workspace
# handed that block cannot start. Ten such stacks were found alive at once, the
# oldest more than a day. stop-stack.sh matches by working directory, so it can
# only ever touch this workspace's own processes.
#
# The resolver is sourced from the ROOT checkout, not from this worktree, so a
# workspace sitting on an old branch cannot archive itself with a stale — or
# missing — copy of it. The inline fallback covers the one case that leaves:
# archiving a branch created before this landed, where the root checkout may not
# have the script either. It must keep computing the same name as `_kdps_slug` in
# workspace-env.sh. A mismatch would leave a workspace's database behind rather
# than delete the wrong one, since a name that matches no project deletes nothing.
archive = """
if [ -x "$CONDUCTOR_ROOT_PATH/scripts/stop-stack.sh" ]; then
  "$CONDUCTOR_ROOT_PATH/scripts/stop-stack.sh" "$PWD" || true
fi
if [ -f "$CONDUCTOR_ROOT_PATH/scripts/workspace-env.sh" ]; then
  . "$CONDUCTOR_ROOT_PATH/scripts/workspace-env.sh"
else
  KDPS_PROJECT="kdps-$(printf '%s' "$CONDUCTOR_WORKSPACE_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9_-]/-/g' -e 's/^[^a-z0-9]*//' -e 's/[^a-z0-9]*$//')"
fi
docker compose -p "$KDPS_PROJECT" -f "$CONDUCTOR_ROOT_PATH/docker-compose.yml" down -v --remove-orphans || true
rm -rf node_modules app/frontend/node_modules app/frontend/dist app/backend/.venv || true
"""

# Concurrent: there is no longer a shared local resource. Ports, container,
# volume and database are all per-workspace, so several workspaces can run the
# stack — and the live-API suites — at the same time.
run_mode = "concurrent"

# One click for the whole stack. dev.sh resolves this workspace's ports itself
# (PWA on CONDUCTOR_PORT, API on +1, Postgres on +2), makes sure the database is
# up and the schema current — a rebase can add migrations and a Mac reboot stops
# the container, so this much is checked every time — and then runs both servers
# as children of one process, trapping SIGHUP, which is how Conductor stops it.
# It does NOT reinstall dependencies or re-seed: that is setup's job, and on a
# provisioned workspace this path is a few seconds.
[scripts.run.dev]
command = "./scripts/dev.sh"
default = true
icon = "rocket"

[scripts.run.frontend]
command = "./scripts/dev.sh --web"
icon = "globe"

[scripts.run.backend]
command = "./scripts/dev.sh --api"
icon = "server"

[scripts.run.test]
command = "npm run ci"
icon = "test-tube"

# Where am I? Prints this workspace's compose project, its three ports and its
# database URL — the first thing to check when a screen shows data you did not
# expect.
[scripts.run.where]
command = "./scripts/dev.sh --where"
icon = "map-pin"
