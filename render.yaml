# Render Blueprint — KDPS Operating System (CLIENT-TESTING alpha)
# -----------------------------------------------------------------------------
# This is the branch the client tests on. It must provision entirely on Render's
# FREE tier — no payment method — so it carries no cron job (crons are paid) and
# every service pins `branch: client-testing`. `main` is Anand's development
# line and must never deploy here; ship by merging main -> client-testing.
#
# Provisions the whole stack from one file:
#   - kdps-db      PostgreSQL 16 (managed)
#   - kdps-erp-api Django API (uvicorn), serves its own static via WhiteNoise
#   - kdps-erp-web React PWA (static site)
#
# Deploy: push to GitHub, then Render Dashboard → New → Blueprint → pick this
# repo. Render reads this file and creates all three. See DEPLOY.md.
#
# BRANCH MODEL (23 Jul 2026): `main` is Anand's development line and does NOT
# deploy. The alpha the client tests on is built from `client-testing` — every
# service below pins `branch: client-testing`. To ship work to the client:
# merge main → client-testing and push; Render auto-deploys that branch only.
#
# IMPORTANT (one manual step): the two cross-URLs below assume the service
# subdomains `kdps-erp-api` and `kdps-erp-web` are free on onrender.com. If
# Render assigns different hostnames, update REACT_APP_BACKEND_URL,
# CORS_ALLOWED_ORIGINS and CSRF_TRUSTED_ORIGINS to the real URLs and redeploy.
# -----------------------------------------------------------------------------

databases:
  - name: kdps-db
    databaseName: kdps
    user: kdps
    plan: free                 # NOTE: free Postgres is deleted after 30 days. Upgrade to keep data.
    postgresMajorVersion: "16"
    region: singapore          # closest Render region to India

services:
  # --- Django API ------------------------------------------------------------
  - type: web
    name: kdps-erp-api
    runtime: python
    branch: client-testing     # never follow main — this stack is the client's
    plan: free                 # free web services spin down when idle (~50s cold start)
    region: singapore
    rootDir: app/backend
    buildCommand: >-
      pip install uv &&
      uv sync --frozen &&
      uv run python manage.py collectstatic --noinput &&
      uv run python manage.py migrate &&
      uv run python manage.py seed_foundation &&
      uv run python manage.py seed_ptmapper
    startCommand: uv run uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DJANGO_SECRET_KEY
        generateValue: true    # Render generates a strong secret
      - key: DJANGO_DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: kdps-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        # NOTE: `fromService property: host` resolves to the bare service slug
        # ("kdps-erp-api"), NOT the public domain, so Django rejected every
        # request as DisallowedHost (HTTP 400). Use the literal host plus a
        # `.onrender.com` wildcard so any onrender.com subdomain is accepted.
        value: kdps-erp-api.onrender.com,.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://kdps-erp-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://kdps-erp-web.onrender.com
      - key: JWT_COOKIE_SECURE
        value: "1"
      - key: JWT_COOKIE_SAMESITE
        value: "None"           # API and web are different onrender.com sites

  # --- Crons — NOT on this branch ----------------------------------------------
  # Render cron jobs have no free tier (cheapest is `starter`, paid), so the cron
  # jobs (kdps-ptmap-learn, kdps-alerts-check, kdps-sell-daily-check) are
  # deliberately absent here: this blueprint must provision on the free plan with
  # no payment method. The daily tasks can be run by hand from a shell against the
  # API service (see DEPLOY.md). All are idempotent and safe to re-run.
  # The cron definitions live on `main`; add them back here only if this stack
  # moves to a paid plan.

  # --- React PWA (static) ----------------------------------------------------
  - type: web
    name: kdps-erp-web
    runtime: static
    branch: client-testing     # never follow main — this stack is the client's
    # NOTE: static sites are served from Render's global CDN — no `region` allowed.
    rootDir: app/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: REACT_APP_BACKEND_URL   # inlined into the bundle at build time
        value: https://kdps-erp-api.onrender.com
    routes:
      - type: rewrite                # SPA: let React Router handle deep links
        source: /*
        destination: /index.html

