# Render Blueprint — KDPS Operating System (alpha / demo)
# -----------------------------------------------------------------------------
# Provisions the whole stack from one file:
#   - kdps-db      PostgreSQL 16 (managed)
#   - kdps-erp-api Django API (uvicorn), serves its own static via WhiteNoise
#   - kdps-erp-web React PWA (static site)
#
# Deploy: push to GitHub, then Render Dashboard → New → Blueprint → pick this
# repo. Render reads this file and creates all three. See DEPLOY.md.
#
# BRANCH MODEL (23 Jul 2026): `main` is Anand's development line and does NOT
# deploy. The alpha the client tests on is built from `client-testing` — every
# service below pins `branch: client-testing`. To ship work to the client:
# merge main → client-testing and push; Render auto-deploys that branch only.
#
# IMPORTANT (one manual step): the two cross-URLs below assume the service
# subdomains `kdps-erp-api` and `kdps-erp-web` are free on onrender.com. If
# Render assigns different hostnames, update REACT_APP_BACKEND_URL,
# CORS_ALLOWED_ORIGINS and CSRF_TRUSTED_ORIGINS to the real URLs and redeploy.
# -----------------------------------------------------------------------------

databases:
  - name: kdps-db
    databaseName: kdps
    user: kdps
    plan: free                 # NOTE: free Postgres is deleted after 30 days. Upgrade to keep data.
    postgresMajorVersion: "16"
    region: singapore          # closest Render region to India

services:
  # --- Django API ------------------------------------------------------------
  - type: web
    name: kdps-erp-api
    runtime: python
    branch: client-testing     # the alpha deploys the CLIENT-TESTING branch, not main
    plan: free                 # free web services spin down when idle (~50s cold start)
    region: singapore
    rootDir: app/backend
    buildCommand: >-
      pip install uv &&
      uv sync --frozen &&
      uv run python manage.py collectstatic --noinput &&
      uv run python manage.py migrate &&
      uv run python manage.py seed_foundation &&
      uv run python manage.py seed_ptmapper &&
      uv run python manage.py seed_outbound_demo &&
      uv run python manage.py seed_demo_data
    startCommand: uv run uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DJANGO_SECRET_KEY
        generateValue: true    # Render generates a strong secret
      - key: DJANGO_DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: kdps-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        # NOTE: `fromService property: host` resolves to the bare service slug
        # ("kdps-erp-api"), NOT the public domain, so Django rejected every
        # request as DisallowedHost (HTTP 400). Use the literal host plus a
        # `.onrender.com` wildcard so any onrender.com subdomain is accepted.
        value: kdps-erp-api.onrender.com,.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://kdps-erp-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://kdps-erp-web.onrender.com
      - key: JWT_COOKIE_SECURE
        value: "1"
      - key: JWT_COOKIE_SAMESITE
        value: "None"           # API and web are different onrender.com sites

  # --- PT-mapper self-improvement cron ---------------------------------------
  # Daily: mine the human-correction log into staged learning proposals, then
  # print the corrections-per-file KPI. The miner only proposes (Rule 8) — a
  # steward still approves each proposal in the app, so this never writes a live
  # rule on its own. NOTE: Render cron jobs are not on the free tier; if you keep
  # the stack on free, run these two commands by hand from a shell instead (see
  # DEPLOY.md). Both are idempotent and safe to re-run.
  - type: cron
    name: kdps-ptmap-learn
    runtime: python
    branch: client-testing     # same code line as the alpha it mines for
    plan: starter
    schedule: "0 20 * * *"     # 20:00 UTC daily (~01:30 IST, low traffic)
    region: singapore
    rootDir: app/backend
    buildCommand: pip install uv && uv sync --frozen
    startCommand: >-
      uv run python manage.py ptmap_mine &&
      uv run python manage.py ptmap_learning_report
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DJANGO_SECRET_KEY
        generateValue: true    # a management command signs nothing — any secret is fine
      - key: DJANGO_DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: kdps-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com

  # --- Alerts cron -------------------------------------------------------------
  # Daily: in-transit aging + return-window 30/15/7, synced into one shared
  # alerts table Home's Alerts surface reads (#77). Idempotent — safe to re-run.
  # Same free-tier caveat as the PT-mapper cron above: run by hand if not on a
  # paid Render plan (see DEPLOY.md).
  - type: cron
    name: kdps-alerts-check
    runtime: python
    branch: client-testing     # same code line as the alpha it checks
    plan: starter
    schedule: "30 20 * * *"    # 20:30 UTC daily (~02:00 IST, after the PT-mapper cron)
    region: singapore
    rootDir: app/backend
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run python manage.py check_alerts
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DJANGO_SECRET_KEY
        generateValue: true    # a management command signs nothing — any secret is fine
      - key: DJANGO_DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: kdps-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com

  # --- Nightly sell reconciliation ----------------------------------------------
  # The daily check (#188), and the pilot's go/no-go gate. Four questions about a
  # day that is over: did every bill arrive, was the customer charged what the
  # rulebook says, is anything still unpriced (the old `sell_age_deferred`
  # schedule, folded in as one of the four), and who took the returns. Writes
  # exception rows only - it posts nothing and touches no document.
  # Idempotent: a bill already flagged is not flagged twice, a flag the store
  # chose to ignore stays ignored, and a hole that filled overnight is closed.
  # It defaults to **yesterday**, which is what this schedule is about: 20:45 UTC
  # is ~02:15 IST, so the day it reconciles is the one that has just ended.
  # Same free-tier caveat as the crons above: run by hand if not on a paid Render
  # plan (see DEPLOY.md).
  - type: cron
    name: kdps-sell-daily-check
    runtime: python
    branch: client-testing     # same code line as the alpha it checks
    plan: starter
    schedule: "45 20 * * *"    # 20:45 UTC daily (~02:15 IST, after the alerts cron)
    region: singapore
    rootDir: app/backend
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run python manage.py sell_daily_check
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DJANGO_SECRET_KEY
        generateValue: true    # a management command signs nothing — any secret is fine
      - key: DJANGO_DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: kdps-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com

  # --- React PWA (static) ----------------------------------------------------
  - type: web
    name: kdps-erp-web
    runtime: static
    branch: client-testing     # the alpha deploys the CLIENT-TESTING branch, not main
    # NOTE: static sites are served from Render's global CDN — no `region` allowed.
    rootDir: app/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: REACT_APP_BACKEND_URL   # inlined into the bundle at build time
        value: https://kdps-erp-api.onrender.com
    routes:
      - type: rewrite                # SPA: let React Router handle deep links
        source: /*
        destination: /index.html
