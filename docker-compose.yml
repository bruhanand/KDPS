# Local KDPS stack: Postgres for dev + CI, and the Django API in a container.
#
# Postgres so `npm run ci` is reproducible on any machine — no Homebrew/host
# assumption. Host port 55432 is a KDPS-specific, high port chosen to avoid
# clashing with a local Homebrew Postgres (5432) or other projects' dev
# databases (which commonly grab 5433/5434).
#
#   docker compose up -d db          # DB only — for `npm run ci` / scripts/dev.sh
#   export DATABASE_URL=postgres://kdps:kdps@localhost:55432/kdps_dev
#   npm run ci
#
#   docker compose up -d db api      # DB + the API at http://localhost:8001
#   npm --prefix app/frontend run dev -- --port 3100
#
# The API is containerised, the PWA is not: Vite's dev server wants the host's
# file watcher, and app/frontend/.env already points the bundle at :8001 — the
# port the api service publishes — so the two halves meet with no extra config.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kdps
      POSTGRES_PASSWORD: kdps
      POSTGRES_DB: kdps_dev
    ports:
      - "55432:5432"
    volumes:
      - kdps_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kdps -d kdps_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./app/backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the database is `db:5432` — the 55432 host
      # mapping above is for tools running on the host, not for this service.
      DATABASE_URL: postgres://kdps:kdps@db:5432/kdps_dev
      # Local-only. The real secret is generated by Render (render.yaml); nothing
      # here is shared with any deployed environment.
      DJANGO_SECRET_KEY: local-docker-dev-not-a-secret
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      # Local dev is plain HTTP, so a Secure-flagged cookie would never be sent
      # back and every cookie-auth request would 401. Render sets this to 1.
      JWT_COOKIE_SECURE: "0"
    # Migrate and seed on every start: both are idempotent, and a container that
    # boots into an unmigrated database is a worse surprise than a slow start.
    command: >-
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_foundation &&
             exec uvicorn server:app --host 0.0.0.0 --port 8000"
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  kdps_pgdata:
