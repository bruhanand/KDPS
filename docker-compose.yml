# Local Postgres for KDPS dev + CI, so `npm run ci` is reproducible on any
# machine — no Homebrew/host assumption. Host port 55432 is a KDPS-specific,
# high port chosen to avoid clashing with a local Homebrew Postgres (5432) or
# other projects' dev databases (which commonly grab 5433/5434).
#
#   docker compose up -d db
#   export DATABASE_URL=postgres://kdps:kdps@localhost:55432/kdps_dev
#   npm run ci
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kdps
      POSTGRES_PASSWORD: kdps
      POSTGRES_DB: kdps_dev
    ports:
      - "55432:5432"
    volumes:
      - kdps_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kdps -d kdps_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kdps_pgdata:
