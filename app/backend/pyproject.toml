[project]
name = "kdps-backend"
version = "0.0.0"
description = "KDPS Operating System — backend (the Django kernel)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.3",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "django-cors-headers>=4.4",
    "python-dotenv>=1.0",
    "bcrypt>=4.0",
    # Fernet, for the Google refresh tokens the `mail` app stores. Already
    # present transitively via simplejwt; declared because we import it directly
    # and a transitive dependency is not a promise.
    "cryptography>=42.0",
    "requests>=2.34.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pyxlsb>=1.0",
    "uvicorn[standard]>=0.25",
    "gunicorn>=26.0.0",
    "whitenoise>=6.12.0",
    # AI document-reader (booking/invoice extraction) — the LLM gateway client.
    # Sourced from a private index/CDN (see [tool.uv] below), not PyPI; litellm is
    # a pinned wheel the gateway requires as a direct URL dependency.
    "litellm @ https://customer-assets.emergentagent.com/internal-asset/library/litellm-1.80.0-py3-none-any.whl",
    "emergentintegrations",
]

# The document-reader gateway client lives on a private package index, not PyPI.
# `explicit = true` confines that index to emergentintegrations alone (mapped via
# [tool.uv.sources]); every other package still resolves from the default PyPI.
[[tool.uv.index]]
name = "emergent"
url = "https://d33sy5i8bnduwe.cloudfront.net/simple/"
explicit = true

[tool.uv.sources]
emergentintegrations = { index = "emergent" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    # Slices `tests/` into contiguous, duration-balanced chunks so cloud CI can
    # run it across a matrix of runners instead of one 19-minute serial pass.
    # Contiguous matters: these black-box suites are order-sensitive, and the
    # default `duration_based_chunks` algorithm preserves collection order
    # inside a chunk where an item-interleaving split would not.
    "pytest-split>=0.9",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    # Without these, every `rest_framework` name is `Any` (the old
    # `ignore_missing_imports` override), and under `strict = true` that made
    # `disallow_subclassing_any` fire on all 252 views, serializers and
    # permissions in the codebase. Those were never 252 defects — they were one
    # missing stub package, invisible while the gate only covered `core config`,
    # which barely touches DRF.
    "djangorestframework-stubs[compatible-mypy]>=3.15",
    "ruff>=0.8",
    "import-linter>=2.1",
]

# --- Lint / format -----------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C90"]

# One function, one job — enforced, because "this function got long" is a review
# comment nobody makes twice. The ceiling is 10 branches; the files below are the
# baseline as it stood when the gate went in (26 Jul 2026), and like the ungated-
# views baseline it may only ever shrink. Anything new, anywhere else, fails.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Management commands: one-shot operational scripts, branch-heavy by nature
# (argument combinations, dry-run/apply, progress reporting). Low blast radius.
"*/management/commands/*.py" = ["C901"]
# The PT-mapper HTTP layer (patch: 25, post: 16) and its taxonomy mapper. The
# mapping engine is the least-safe thing in the codebase to restructure while
# archetypes are still being fed; splitting these is its own ticket.
"ptmapper/views.py" = ["C901"]
"ptmapper/engine.py" = ["C901"]
# The collection hook that decides which live suites can run here: a decision
# table about the target environment, and clearest read as one.
"tests/conftest.py" = ["C901"]

# --- Types -------------------------------------------------------------------
# K0 started mypy strict on a tiny surface (core + config) on the promise that
# "the strict surface grows with the code; it never shrinks". It did not grow -
# it sat on two modules while eighteen apps were written behind it (#292).
#
# The gate is now the whole backend (`mypy .`), not a list of apps. A list is the
# tempting shape and the wrong one: it gates what somebody remembered to add, so
# a new app arrives untyped and the gate stays green while saying nothing about
# it. Checking everything and naming the exclusions inverts that - the surface
# can only grow, and shrinking it means deleting a line somebody has to justify.
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
# `migrations/` are generated; `tests/` is a separate argument about how strictly
# test code should type and is not this ticket's. The last two are not source at
# all - they only need naming because `mypy .` walks the directory tree.
exclude = ['migrations/', 'tests/', '\.venv/', 'staticfiles/']

[[tool.mypy.overrides]]
module = ["dj_database_url"]
ignore_missing_imports = true

# Third-party packages that publish no stubs and no `py.typed`. Declared once
# here rather than as an inline ignore at each of the eight import sites: the
# fact is a property of the dependency, not of the line that imports it, and
# eight copies drift the moment one file stops importing it (`strict` turns a
# stale ignore into an error, so drift is loud but still busywork). The three
# spreadsheet readers are the PT/invoice ingest path; `emergentintegrations` is
# the vendored LLM client. Publishing stubs for any of them - `types-openpyxl`
# is the obvious first - would mean deleting its line here and typing the call
# sites, which is the direction of travel, not a new argument.
[[tool.mypy.overrides]]
module = ["openpyxl.*", "xlrd.*", "pyxlsb.*", "emergentintegrations.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

# --- Tests -------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
    "local_backend: only valid against this checkout's own locally-booted uvicorn (shared DATABASE_URL, no CORS-rewriting proxy)",
]

# --- Architecture boundaries -------------------------------------------------
# The kernel (`core`) must never depend on the project wiring layer (`config`).
# This contract is the seed of "the kernel knows nothing about the modules".
[tool.importlinter]
root_packages = [
    # `mail` is a root package for a reason worth knowing: nothing imports it.
    # It is mounted by string (`include("mail.urls")`), so it never enters the
    # graph as a dependency of anything, and a contract naming it as a source
    # would fail with "module does not exist". Being unimported is exactly the
    # property the two mail contracts below exist to keep.
    "config", "core", "ptmapper", "approvals", "outbound", "offers", "search", "storefront",
    "mail",
]
# The domain apps below aren't root packages yet, so they are "external" to the
# graph; the approvals contract names them explicitly.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core (kernel) must not import the config/project layer"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["config"]

[[tool.importlinter.contracts]]
# `approvals` is a cross-cutting service every domain module depends on *downward*
# (ADR-0002's core/masters exception in spirit): it must never know what it is
# approving. Enforced, not trusted — the maker-checker spine erodes fastest if a
# convenience import from outbound sneaks in.
name = "approvals (maker-checker spine) must not import any domain module"
type = "forbidden"
source_modules = ["approvals"]
forbidden_modules = [
    "config",
    "outbound",
    "inbound",
    "vendors",
    "ptmapper",
    "stockledger",
    "finledger",
    "sell",
    "offers",
]

[[tool.importlinter.contracts]]
name = "ptmapper mapping/learning layer must not import the HTTP (views) layer"
type = "forbidden"
source_modules = [
    "ptmapper.processing",
    "ptmapper.learning",
    "ptmapper.engine",
    "ptmapper.models",
    "ptmapper.profiles",
]
forbidden_modules = ["ptmapper.views"]

[[tool.importlinter.contracts]]
# The two composition roots read across every domain app so that no domain app
# has to read another one just to draw a screen (`search` for the top bar,
# `storefront` for the store's Home). That only buys anything while the arrow
# points one way: the moment a domain module imports one of them for a helper,
# they stop being leaves and become another layer everything depends on. The
# settings comment beside them said "imported by none of them" and nothing
# checked it; this is the check (#174).
name = "the composition roots are leaves: no domain module may import them"
type = "forbidden"
source_modules = [
    # `config` is deliberately absent: mounting the two is its whole job.
    "core",
    "ptmapper",
    "approvals",
    "outbound",
    "masters",
    "accounts",
    "inbound",
    "vendors",
    "stockledger",
    "finledger",
    "alerts",
    "files",
    "offers",
    "mail",
]
forbidden_modules = ["search", "storefront"]

[[tool.importlinter.contracts]]
# Mail is a leaf, and the value of this feature depends on it staying one. It
# caches a person's Google inbox; it writes no ledger, posts no entry and owns
# no document. The moment a domain module imports it, mail has become part of
# the money path by the back door — and the moment it imports a domain module,
# somebody has started deriving business state from an inbox we do not control
# and may drop and refill at will. Both directions are forbidden.
name = "mail must not import any domain module"
type = "forbidden"
source_modules = ["mail"]
forbidden_modules = [
    "outbound",
    "inbound",
    "vendors",
    "ptmapper",
    "stockledger",
    "finledger",
    "sell",
    "offers",
    "approvals",
    "alerts",
    "search",
    "storefront",
]

[[tool.importlinter.contracts]]
# The other direction, and the one that actually protects the books.
name = "no domain module may import mail"
type = "forbidden"
source_modules = [
    "core",
    "ptmapper",
    "approvals",
    "outbound",
    "masters",
    "accounts",
    "inbound",
    "vendors",
    "stockledger",
    "finledger",
    "alerts",
    "files",
    "offers",
    "search",
    "storefront",
]
forbidden_modules = ["mail"]

[[tool.importlinter.contracts]]
# The rulebook is a leaf below the counter, and it has to stay one: the engine
# runs unchanged in a browser tab, so the moment `offers` reaches for a Sale it
# stops being portable and the TypeScript port stops being a port. `sell` reads
# `offers` (the dataset ships it, the accept pipeline re-prices with it); the
# arrow never turns round.
name = "the rulebook must not import the counter"
type = "forbidden"
source_modules = ["offers"]
forbidden_modules = ["sell", "config", "outbound", "inbound", "vendors", "ptmapper"]

[[tool.importlinter.contracts]]
# `posting` imports `maker_checker` (every posting path asks whether a second
# person is needed) and `maker_checker` needed the cost of a piece and the
# refusal type back — a real cycle, previously held apart by four function-level
# imports. Those two things now live in `costing`, below both. Stated as layers
# so the deferred-import workaround can never be reintroduced as the fix.
name = "outbound posting is layered: posting → maker_checker → costing, never back"
type = "layers"
layers = ["outbound.posting", "outbound.maker_checker", "outbound.costing"]
